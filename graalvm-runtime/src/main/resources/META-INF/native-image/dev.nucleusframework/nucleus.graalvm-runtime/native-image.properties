# Resource inclusion globs moved to reachability-metadata.json ("resources") — the
# deprecated -H:IncludeResources option warns and will be removed. SharedArenaSupport
# stays here as it has no metadata equivalent.
#
# Deliberately NO `--initialize-at-build-time=org.slf4j`: a generic runtime module must
# not freeze the lifecycle of an application-selected logging backend. Under SLF4J 2.x
# that flag runs provider discovery during analysis, so `LoggerFactory.PROVIDER` and
# `MDC.MDC_ADAPTER` land in the image heap holding backend objects (e.g. Logback's
# LogbackMDCAdapter) whose classes stay run-time initialized — which native-image
# rejects. Apps with a fixed, tested backend can opt in themselves via
# `graalvm { buildArgs.add("--initialize-at-build-time=org.slf4j") }`.
Args = -H:+UnlockExperimentalVMOptions \
       -H:+SharedArenaSupport
