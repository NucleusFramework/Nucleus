[package]
name = "nucleus_fs_watcher"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nucleus_fs_watcher"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
notify = "=9.0.0-rc.6"
notify-debouncer-full = "=0.8.0-rc.2"
once_cell = "1.20"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
