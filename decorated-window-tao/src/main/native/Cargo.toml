[package]
name = "nucleus_tao"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nucleus_tao"
crate-type = ["cdylib"]

[dependencies]
tao = "0.35"
jni = "0.21"
once_cell = "1.20"

[build-dependencies]
cc = "1.0"

# Smaller binaries for shipping inside the JAR / native-image.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
