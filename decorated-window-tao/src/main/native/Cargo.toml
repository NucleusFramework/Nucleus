[package]
name = "nucleus_tao"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nucleus_tao"
crate-type = ["cdylib"]

[dependencies]
# Migrated from tao 0.35 — see decorated-window-tao/MIGRATION.md.
# `rwh_06` keeps the existing raw-window-handle 0.6 surface our Linux/Windows
# JNI handles depend on.
winit = { version = "0.30", features = ["rwh_06"] }
jni = "0.21"
once_cell = "1.20"

# winit 0.30 talks directly to X11 (x11-dl) and Wayland (wayland-client) without
# going through GTK. We still pull `raw-window-handle 0.6` explicitly so the
# Linux JNI bridge can extract Xlib / Wayland pointers for the EGL helper.
# `glib` is kept temporarily for the legacy GDK code path in `linux/handles.rs`
# and `linux/cursor.rs`; it is removed in Phase 3.4 of the migration along with
# the rest of the GTK shim.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
glib = "0.18"
# AT-SPI2 accessibility provider via AccessKit. Pure-Rust D-Bus (zbus) so we
# don't have to link libatspi / libatk / glib at runtime. We're an XWayland
# client (GDK_BACKEND=x11) so screen-space coordinates are available through
# the X server — `Adapter::set_root_window_bounds` works correctly.
accesskit = "0.21"
accesskit_unix = "0.17"
# X11 for resolving outer/inner window geometry on every ConfigureNotify.
x11-dl = "2"

[build-dependencies]
cc = "1.0"

# Vendored fork of accesskit_atspi_common 0.14.2 with three local patches
# that the upstream 0.14 release doesn't include:
#   - State::Modal exposure when node.is_modal() (Compose IsDialog semantic)
#   - `level: N` attribute via Accessible.GetAttributes (heading level)
#   - (planned) Interface::EditableText for text inputs
# accesskit_unix consumes accesskit_atspi_common transitively, so this
# patch propagates without needing to fork accesskit_unix itself.
[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
accesskit_unix = { path = "vendor/accesskit_unix" }

# Smaller binaries for shipping inside the JAR / native-image.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
