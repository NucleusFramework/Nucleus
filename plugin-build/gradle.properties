ID=dev.nucleusframework
GROUP=dev.nucleusframework
DISPLAY_NAME=Nucleus Gradle Plugin
DESCRIPTION=A JVM desktop application packaging plugin
WEBSITE=https://github.com/NucleusFramework/Nucleus
VCS_URL=https://github.com/NucleusFramework/Nucleus
IMPLEMENTATION_CLASS=dev.nucleusframework.NucleusPlugin

# Same heap budget as the root build (see its gradle.properties): the included build gets
# its own daemon when it is invoked standalone.
org.gradle.jvmargs=-XX:MaxRAMPercentage=40 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

compose.version=1.10.0
compose.material3.version=1.9.0
