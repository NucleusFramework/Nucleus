[package]
name = "sample_tao_webview"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "sample_tao_webview"
crate-type = ["cdylib"]

[dependencies]
# wry 0.55 ships with tao 0.35-compatible window-handle plumbing and
# direct HWND parenting via `WebViewBuilder::build_as_child` taking a
# raw Win32WindowHandle. WebView2 Runtime is required at run-time on
# the user's machine (bundled with Edge on Win10/11 modern builds;
# install via the WebView2 Evergreen Bootstrapper if missing).
wry = { version = "0.55", default-features = false }
jni = "0.21"
once_cell = "1.20"
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
