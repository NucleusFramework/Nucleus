# Jewel 0.39 standalone native-image compatibility.
#
# Jewel 0.39's IntUiTheme builds a StandalonePlatformCursorController whose default
# arg references the macOS object MacPlatformServicesDefaultImpl. Its <clinit> runs
# UnsafeAccessing, which sets AccessibleObject.override via a sun.misc.Unsafe field-
# offset hack. That offset is computed from a proxy field and is invalid under SVM's
# object layout, so at run time the write lands on the wrong field, checkAccess is not
# skipped, and Method.invoke segfaults. Initializing these classes at build time runs
# the reflective/Unsafe setup on HotSpot (correct offset) so nothing reflective runs
# at run time. The foundation.util package covers JewelLogger and all its nested
# factories that end up in the image heap once the object above is built at build time.
#
# MacPlatformServicesDefaultImpl also holds a `logger` static, so that build-time
# <clinit> resolves one SLF4J logger into the image heap. Since nucleus.graalvm-runtime
# no longer initializes org.slf4j at build time (issue #443), that logger's class has to
# be named here — narrowly. With no backend bound, Jewel's reflective factory gets a
# NOPLogger, the API's own stateless no-op logger, not a replaceable backend: naming that
# one class freezes nothing the application chose. Naming the whole org.slf4j package
# instead would additionally freeze MDC.MDC_ADAPTER and LoggerFactory.PROVIDER for every
# Jewel app, which is the #443 defect scoped down rather than fixed.
#
# Known limitation, pre-dating #443: an app that binds a real SLF4J backend AND uses
# Jewel cannot build, because Jewel's build-time <clinit> then parks a backend logger
# (e.g. ch.qos.logback.classic.Logger) in the image heap. That is a Jewel issue — the
# fix belongs upstream (a lazy logger) or in a field substitution, not in restoring the
# generic org.slf4j setting, which broke every non-Jewel app instead.
Args = --initialize-at-build-time=org.jetbrains.jewel.intui.standalone.window.UnsafeAccessing \
       --initialize-at-build-time=org.jetbrains.jewel.intui.standalone.window.macos.MacPlatformServicesDefaultImpl \
       --initialize-at-build-time=org.jetbrains.jewel.foundation.util \
       --initialize-at-build-time=org.slf4j.helpers.NOPLogger
