[package]
name = "nucleus_flatpak"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nucleus_flatpak"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
# Pure-Rust D-Bus: no libdbus at build or run time. The blocking API runs on the monitor's own
# thread, so the app's async runtime (if any) is never involved.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# The Linux build script strips the copied library (`strip --strip-unneeded`), like the other
# Rust modules.
strip = false
