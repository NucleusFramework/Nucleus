[package]
name = "nucleus_share"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nucleus_share"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-collections = "0.3"
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSSharingService",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Not "symbols" (nor "debuginfo"): rustc's own strip pass, run with Xcode 27's toolchain
# (ld-27037), leaves a mis-aligned LINKEDIT string pool that dyld refuses to load. The
# macOS and Linux build scripts strip the copied library instead (`strip -x` /
# `strip --strip-unneeded`); MSVC keeps symbols in the PDB, not the DLL.
strip = false
