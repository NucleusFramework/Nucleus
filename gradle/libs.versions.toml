[versions]
agp = "9.1.1"
asm = "9.10.1"
bcv = "0.18.1"
awsSdk = "2.54.4"
batik = "1.19"
coilVersion = "3.5.0"
compose = "1.12.0"
coroutines = "1.11.0"
composenativetray = "2.1.0"
composewebview = "1.0.1"
detekt = "2.0.0-alpha.6"
downloadTask = "5.7.0"
filekit = "0.15.0"
graalvmNative = "1.1.3"
# Must match the hot-reload version bundled by the Compose Gradle plugin (which auto-applies
# hot-reload to every Compose module): TaoHotReloadBridgeImpl compiles against these artifacts
# but the runtime ones come from the agent, and the WindowsState API is not binary-stable
# across releases. Compose 1.12.x bundles 1.2.0 — bump both together.
hotReload = "1.2.0"
icons = "262.9437.16"
jewel = "0.39.1-262.9437.29"
jna = "5.19.1"
kotlin = "2.4.10"
kotlinPoet = "2.3.0"
kotlinxSerialization = "1.11.0"
kover = "0.9.9"
ktlintGradle = "14.2.0"
ktor = "3.5.2"
lifecycleViewmodelNavigation3 = "2.11.0"
lighthouse = "2.3.2"
# Only used by :examples:tao-native-test, as the native-image regression fixture for the
# SLF4J/Logback build-time-initialization clash (issue #443).
logback = "1.6.3"
material3 = "1.12.0-alpha03"
materialkolor = "4.1.1"
navigation3 = "1.1.1"
materialIcons = "1.7.3"
okhttp = "5.5.0"
pluginPublish = "2.1.1"
reorderable = "3.1.0"
thumbnailator = "0.4.21"
vanniktechMavenPublish = "0.37.0"
versionCheck = "0.61.0"
zstdKmp = "0.4.0"

[plugins]
binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
detekt = { id = "dev.detekt", version.ref = "detekt"}
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin"}
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle"}
pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish"}
versionCheck = { id = "com.github.ben-manes.versions", version.ref = "versionCheck"}
vanniktechMavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish"}
kotlinComposePlugin = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin"}
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose"}
graalvmNative = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNative" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "hotReload" }
lighthouse = { id = "io.github.dev-vikas-soni.lighthouse", version.ref = "lighthouse" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilVersion" }
hot-reload-agent = { module = "org.jetbrains.compose.hot-reload:hot-reload-agent", version.ref = "hotReload" }
hot-reload-core = { module = "org.jetbrains.compose.hot-reload:hot-reload-core", version.ref = "hotReload" }
hot-reload-orchestration = { module = "org.jetbrains.compose.hot-reload:hot-reload-orchestration", version.ref = "hotReload" }
hot-reload-devtools-api = { module = "org.jetbrains.compose.hot-reload:hot-reload-devtools-api", version.ref = "hotReload" }
intellij-icons = { module = "com.jetbrains.intellij.platform:icons", version.ref = "icons" }
intellij-icons-api = { module = "com.jetbrains.intellij.platform:icons-api", version.ref = "icons" }
intellij-icons-impl = { module = "com.jetbrains.intellij.platform:icons-impl", version.ref = "icons" }
junit = "junit:junit:4.13.2"
zstd-kmp-jvm = { module = "com.squareup.zstd:zstd-kmp-jvm", version.ref = "zstdKmp" }
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
agp-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
download-task = { module = "de.undercouch:gradle-download-task", version.ref = "downloadTask" }
kotlin-poet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinPoet" }
batik-transcoder = { module = "org.apache.xmlgraphics:batik-transcoder", version.ref = "batik" }
