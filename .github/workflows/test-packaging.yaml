name: Test Packaging (All Platforms)

on:
  pull_request:
    branches:
      - '*'

concurrency:
  group: test-packaging-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-natives:
    uses: ./.github/workflows/build-natives.yaml

  build:
    needs: build-natives
    name: Package - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            arch: amd64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            arch: arm64
          - name: Windows x64
            os: windows-latest
            arch: amd64
          - name: Windows ARM64
            os: windows-11-arm
            arch: arm64
            node-version: '22' # npm 11 (Node 24) has ECOMPROMISED bugs on Windows ARM64
          - name: macOS ARM64
            os: macos-latest
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            arch: amd64

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Nucleus
        uses: ./.github/actions/setup-nucleus
        with:
          packaging-tools: 'true'
          flatpak: 'true'
          snap: 'true'
          setup-gradle: 'true'
          setup-node: 'true'
          node-version: ${{ matrix.node-version || '24' }}

      - name: Download darkmode-detector native artifacts
        uses: actions/download-artifact@v4
        with:
          path: darkmode-detector/src/main/resources/nucleus/native/
          pattern: '*-natives*'
          merge-multiple: true

      - name: Download native-ssl artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-ssl/src/main/resources/nucleus/native/
          pattern: 'ssl-*'
          merge-multiple: true

      - name: Download decorated-window-jbr artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-jbr/src/main/resources/nucleus/native/
          pattern: 'decorated-window-jbr-*'
          merge-multiple: true

      - name: Download decorated-window-jni artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-jni/src/main/resources/nucleus/native/
          pattern: 'decorated-window-jni-*'
          merge-multiple: true

      - name: Download decorated-window-core artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-core/src/main/resources/nucleus/native/
          pattern: 'decorated-window-core-*'
          merge-multiple: true

      - name: Download linux-hidpi artifacts
        uses: actions/download-artifact@v4
        with:
          path: linux-hidpi/src/main/resources/nucleus/native/
          pattern: 'linux-hidpi-*'
          merge-multiple: true

      - name: Download system-color artifacts
        uses: actions/download-artifact@v4
        with:
          path: system-color/src/main/resources/nucleus/native/
          pattern: 'system-color-*'
          merge-multiple: true

      - name: Download energy-manager artifacts
        uses: actions/download-artifact@v4
        with:
          path: energy-manager/src/main/resources/nucleus/native/
          pattern: 'energy-manager-*'
          merge-multiple: true

      - name: Download taskbar-progress artifacts
        uses: actions/download-artifact@v4
        with:
          path: taskbar-progress/src/main/resources/nucleus/native/
          pattern: 'taskbar-progress-*'
          merge-multiple: true

      - name: Download fs-watcher artifacts
        uses: actions/download-artifact@v4
        with:
          path: fs-watcher/src/main/resources/nucleus/native/
          pattern: 'fs-watcher-*'
          merge-multiple: true

      - name: Download notification-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-macos/src/main/resources/nucleus/native/
          pattern: 'notification-macos*'
          merge-multiple: true

      - name: Download service-management-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: service-management-macos/src/main/resources/nucleus/native/
          pattern: 'service-management-macos*'
          merge-multiple: true

      - name: Download notification-linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-linux/src/main/resources/nucleus/native/
          pattern: 'notification-linux-*'
          merge-multiple: true

      - name: Download notification-windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-windows/src/main/resources/nucleus/native/
          pattern: 'notification-windows*'
          merge-multiple: true

      - name: Download autolaunch artifacts
        uses: actions/download-artifact@v4
        with:
          path: autolaunch/src/main/resources/nucleus/native/
          pattern: 'autolaunch*'
          merge-multiple: true

      - name: Download launcher-windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-windows/src/main/resources/nucleus/native/
          pattern: 'launcher-windows*'
          merge-multiple: true

      - name: Download launcher-linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-linux/src/main/resources/nucleus/native/
          pattern: 'launcher-linux-*'
          merge-multiple: true

      - name: Download launcher-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-macos/src/main/resources/nucleus/native/
          pattern: 'launcher-macos*'
          merge-multiple: true

      - name: Download global-hotkey artifacts
        uses: actions/download-artifact@v4
        with:
          path: global-hotkey/src/main/resources/nucleus/native/
          pattern: 'global-hotkey-*'
          merge-multiple: true

      - name: Download menu-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: menu-macos/src/main/resources/nucleus/native/
          pattern: 'menu-macos*'
          merge-multiple: true

      - name: Download system-info artifacts
        uses: actions/download-artifact@v4
        with:
          path: system-info/src/main/resources/nucleus/native/
          pattern: 'system-info-*'
          merge-multiple: true

      - name: Download scheduler artifacts
        uses: actions/download-artifact@v4
        with:
          path: scheduler/src/main/resources/nucleus/native/
          pattern: 'scheduler-*'
          merge-multiple: true

      - name: Download media-control artifacts
        uses: actions/download-artifact@v4
        with:
          path: media-control/src/main/resources/nucleus/native/
          pattern: 'media-control-*'
          merge-multiple: true

      - name: Download decorated-window-tao artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-tao/src/main/resources/nucleus/native/
          pattern: 'decorated-window-tao-*'
          merge-multiple: true

      - name: Download graalvm-runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: graalvm-runtime/src/main/resources/nucleus/native/
          pattern: 'graalvm-runtime-*'
          merge-multiple: true

      - name: Configure Linux GPG signing
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "No LINUX_GPG_PRIVATE_KEY secret set; skipping Linux package signing."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/nucleus-signing-key.asc"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          {
            echo "compose.desktop.linux.sign=true"
            echo "compose.desktop.linux.signing.keyId=$LINUX_GPG_KEY_ID"
            echo "compose.desktop.linux.signing.keyFile=$KEY_FILE"
            echo "compose.desktop.linux.signing.passphrase=$LINUX_GPG_PASSPHRASE"
          } >> gradle.properties

      - name: Build packages
        shell: bash
        run: ./gradlew :examples:nucleus-demo:packageReleaseDistributionForCurrentOS --stacktrace --no-daemon

      - name: Upload packaged artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-packages-${{ runner.os }}-${{ matrix.arch }}
          path: |
            examples/nucleus-demo/build/compose/binaries/**/*.deb
            examples/nucleus-demo/build/compose/binaries/**/*.rpm
            examples/nucleus-demo/build/compose/binaries/**/*.pub.asc
            examples/nucleus-demo/build/compose/binaries/**/*.pacman
            examples/nucleus-demo/build/compose/binaries/**/*.snap
            examples/nucleus-demo/build/compose/binaries/**/*.flatpak
            examples/nucleus-demo/build/compose/binaries/**/*.AppImage
            examples/nucleus-demo/build/compose/binaries/**/*.appimage
            examples/nucleus-demo/build/compose/binaries/**/*.msi
            examples/nucleus-demo/build/compose/binaries/**/*.exe
            examples/nucleus-demo/build/compose/binaries/**/*.appx
            !examples/nucleus-demo/build/compose/binaries/**/runtime/**
            examples/nucleus-demo/build/compose/binaries/**/*.7z
            examples/nucleus-demo/build/compose/binaries/**/*.pkg
            examples/nucleus-demo/build/compose/binaries/**/*.dmg
            examples/nucleus-demo/build/compose/binaries/**/*.zip
            examples/nucleus-demo/build/compose/binaries/**/*.tar
            examples/nucleus-demo/build/compose/binaries/**/*.tar.gz
            examples/nucleus-demo/build/compose/binaries/**/*.blockmap
            !examples/nucleus-demo/build/compose/binaries/**/app/**
          if-no-files-found: warn
