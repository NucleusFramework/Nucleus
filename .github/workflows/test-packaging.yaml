name: Test Packaging (All Platforms)

# Invoked from pre-merge after cheap JVM gates succeed. Does not rebuild
# natives — the caller must have already uploaded natives-* artifacts.
on:
  workflow_call:

jobs:
  build:
    name: Package - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # Cancel remaining platforms when one fails — packaging is expensive and
      # a shared Gradle/plugin regression usually hits every OS the same way.
      fail-fast: true
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            arch: amd64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            arch: arm64
          - name: Windows x64
            os: windows-latest
            arch: amd64
          - name: Windows ARM64
            os: windows-11-arm
            arch: arm64
            node-version: '22' # npm 11 (Node 24) has ECOMPROMISED bugs on Windows ARM64
          - name: macOS ARM64
            os: macos-latest
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            arch: amd64

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Nucleus
        uses: ./.github/actions/setup-nucleus
        with:
          packaging-tools: 'true'
          flatpak: 'true'
          snap: 'true'
          setup-gradle: 'true'
          setup-node: 'true'
          node-version: ${{ matrix.node-version || '24' }}

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Configure Linux GPG signing
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "No LINUX_GPG_PRIVATE_KEY secret set; skipping Linux package signing."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/nucleus-signing-key.asc"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          {
            echo "compose.desktop.linux.sign=true"
            echo "compose.desktop.linux.signing.keyId=$LINUX_GPG_KEY_ID"
            echo "compose.desktop.linux.signing.keyFile=$KEY_FILE"
            echo "compose.desktop.linux.signing.passphrase=$LINUX_GPG_PASSPHRASE"
            echo "compose.desktop.linux.signing.silentUpdate=true"
          } >> gradle.properties

      - name: Build packages
        shell: bash
        run: ./gradlew :examples:nucleus-demo:packageReleaseDistributionForCurrentOS --stacktrace --no-daemon

      - name: Upload packaged artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-packages-${{ runner.os }}-${{ matrix.arch }}
          path: |
            examples/nucleus-demo/build/compose/binaries/**/*.deb
            examples/nucleus-demo/build/compose/binaries/**/*.rpm
            # Detached signatures (<pkg>.asc) for silent update + public keys (<pkg>.pub.asc)
            examples/nucleus-demo/build/compose/binaries/**/*.asc
            examples/nucleus-demo/build/compose/binaries/**/*.pacman
            examples/nucleus-demo/build/compose/binaries/**/*.snap
            examples/nucleus-demo/build/compose/binaries/**/*.flatpak
            examples/nucleus-demo/build/compose/binaries/**/*.AppImage
            examples/nucleus-demo/build/compose/binaries/**/*.appimage
            examples/nucleus-demo/build/compose/binaries/**/*.msi
            examples/nucleus-demo/build/compose/binaries/**/*.exe
            examples/nucleus-demo/build/compose/binaries/**/*.appx
            !examples/nucleus-demo/build/compose/binaries/**/runtime/**
            examples/nucleus-demo/build/compose/binaries/**/*.7z
            examples/nucleus-demo/build/compose/binaries/**/*.pkg
            examples/nucleus-demo/build/compose/binaries/**/*.dmg
            examples/nucleus-demo/build/compose/binaries/**/*.zip
            examples/nucleus-demo/build/compose/binaries/**/*.tar
            examples/nucleus-demo/build/compose/binaries/**/*.tar.gz
            examples/nucleus-demo/build/compose/binaries/**/*.blockmap
            !examples/nucleus-demo/build/compose/binaries/**/app/**
          if-no-files-found: warn
