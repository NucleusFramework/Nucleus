name: Publish Plugin to Portal

on:
  push:
    tags:
      - '*'

jobs:
  validate-release-ref:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      is-dev: ${{ steps.tag.outputs.is-dev }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify release tag
        id: tag
        uses: ./.github/actions/release-tag-info

      - name: Validate release ref
        uses: ./.github/actions/validate-release-ref

  build-natives:
    needs: validate-release-ref
    uses: ./.github/workflows/build-natives.yaml

  gradle:
    needs: [validate-release-ref, build-natives]
    runs-on: ubuntu-22.04
    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libdbus-1-dev libglib2.0-dev

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Cache Gradle Caches
        uses: gradle/actions/setup-gradle@v5

      # Dev tags (`v2.6.0-dev-<timestamp>`) go out unverified on purpose; real
      # release tags still have to pass preMerge before reaching the portal.
      - name: Run Gradle tasks
        if: needs.validate-release-ref.outputs.is-dev != 'true'
        run: ./gradlew preMerge --continue

      - name: Publish on Plugin Portal
        run: ./gradlew --project-dir plugin-build setupPluginUploadFromEnvironment publishPlugins
        if: success()
