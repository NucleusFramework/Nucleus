name: Release Desktop App (All Platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release ref
        uses: ./.github/actions/validate-release-ref

  build-natives:
    needs: validate-release-ref
    uses: ./.github/workflows/build-natives.yaml

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    needs: [validate-release-ref, build-natives]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
            node-version: '22' # npm 11 (Node 24) has ECOMPROMISED bugs on Windows ARM64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Normalize version for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          echo "RELEASE_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Setup Nucleus
        uses: ./.github/actions/setup-nucleus
        with:
          packaging-tools: 'true'
          flatpak: 'true'
          snap: 'true'
          setup-gradle: 'true'
          setup-node: 'true'
          node-version: ${{ matrix.node-version || '24' }}

      - name: Download darkmode-detector native artifacts
        uses: actions/download-artifact@v4
        with:
          path: darkmode-detector/src/main/resources/nucleus/native/
          pattern: '*-natives*'
          merge-multiple: true

      - name: Download native-ssl artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-ssl/src/main/resources/nucleus/native/
          pattern: 'ssl-*'
          merge-multiple: true

      - name: Download decorated-window-jbr artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-jbr/src/main/resources/nucleus/native/
          pattern: 'decorated-window-jbr-*'
          merge-multiple: true

      - name: Download decorated-window-jni artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-jni/src/main/resources/nucleus/native/
          pattern: 'decorated-window-jni-*'
          merge-multiple: true

      - name: Download decorated-window-core artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-core/src/main/resources/nucleus/native/
          pattern: 'decorated-window-core-*'
          merge-multiple: true

      - name: Download linux-hidpi artifacts
        uses: actions/download-artifact@v4
        with:
          path: linux-hidpi/src/main/resources/nucleus/native/
          pattern: 'linux-hidpi-*'
          merge-multiple: true

      - name: Download system-color artifacts
        uses: actions/download-artifact@v4
        with:
          path: system-color/src/main/resources/nucleus/native/
          pattern: 'system-color-*'
          merge-multiple: true

      - name: Download energy-manager artifacts
        uses: actions/download-artifact@v4
        with:
          path: energy-manager/src/main/resources/nucleus/native/
          pattern: 'energy-manager-*'
          merge-multiple: true

      - name: Download taskbar-progress artifacts
        uses: actions/download-artifact@v4
        with:
          path: taskbar-progress/src/main/resources/nucleus/native/
          pattern: 'taskbar-progress-*'
          merge-multiple: true

      - name: Download fs-watcher artifacts
        uses: actions/download-artifact@v4
        with:
          path: fs-watcher/src/main/resources/nucleus/native/
          pattern: 'fs-watcher-*'
          merge-multiple: true

      - name: Download notification-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-macos/src/main/resources/nucleus/native/
          pattern: 'notification-macos*'
          merge-multiple: true

      - name: Download service-management-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: service-management-macos/src/main/resources/nucleus/native/
          pattern: 'service-management-macos*'
          merge-multiple: true

      - name: Download notification-linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-linux/src/main/resources/nucleus/native/
          pattern: 'notification-linux-*'
          merge-multiple: true

      - name: Download notification-windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: notification-windows/src/main/resources/nucleus/native/
          pattern: 'notification-windows*'
          merge-multiple: true

      - name: Download autolaunch artifacts
        uses: actions/download-artifact@v4
        with:
          path: autolaunch/src/main/resources/nucleus/native/
          pattern: 'autolaunch*'
          merge-multiple: true

      - name: Download launcher-windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-windows/src/main/resources/nucleus/native/
          pattern: 'launcher-windows*'
          merge-multiple: true

      - name: Download launcher-linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-linux/src/main/resources/nucleus/native/
          pattern: 'launcher-linux-*'
          merge-multiple: true

      - name: Download launcher-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: launcher-macos/src/main/resources/nucleus/native/
          pattern: 'launcher-macos*'
          merge-multiple: true

      - name: Download global-hotkey artifacts
        uses: actions/download-artifact@v4
        with:
          path: global-hotkey/src/main/resources/nucleus/native/
          pattern: 'global-hotkey-*'
          merge-multiple: true

      - name: Download menu-macos artifacts
        uses: actions/download-artifact@v4
        with:
          path: menu-macos/src/main/resources/nucleus/native/
          pattern: 'menu-macos*'
          merge-multiple: true

      - name: Download system-info artifacts
        uses: actions/download-artifact@v4
        with:
          path: system-info/src/main/resources/nucleus/native/
          pattern: 'system-info-*'
          merge-multiple: true

      - name: Download scheduler artifacts
        uses: actions/download-artifact@v4
        with:
          path: scheduler/src/main/resources/nucleus/native/
          pattern: 'scheduler-*'
          merge-multiple: true

      - name: Download media-control artifacts
        uses: actions/download-artifact@v4
        with:
          path: media-control/src/main/resources/nucleus/native/
          pattern: 'media-control-*'
          merge-multiple: true

      - name: Download decorated-window-tao artifacts
        uses: actions/download-artifact@v4
        with:
          path: decorated-window-tao/src/main/resources/nucleus/native/
          pattern: 'decorated-window-tao-*'
          merge-multiple: true

      - name: Download graalvm-runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: graalvm-runtime/src/main/resources/nucleus/native/
          pattern: 'graalvm-runtime-*'
          merge-multiple: true

      - name: Configure Linux GPG signing
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "No LINUX_GPG_PRIVATE_KEY secret set; skipping Linux package signing."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/nucleus-signing-key.asc"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          {
            echo "compose.desktop.linux.sign=true"
            echo "compose.desktop.linux.signing.keyId=$LINUX_GPG_KEY_ID"
            echo "compose.desktop.linux.signing.keyFile=$KEY_FILE"
            echo "compose.desktop.linux.signing.passphrase=$LINUX_GPG_PASSPHRASE"
          } >> gradle.properties

      - name: Build packages
        shell: bash
        run: ./gradlew :examples:nucleus-demo:packageReleaseDistributionForCurrentOS --stacktrace --no-daemon

      - name: Create sandboxed app ZIP (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SANDBOXED_APP="$(find examples/nucleus-demo/build/compose/binaries -path '*/app-sandboxed/*.app' -type d | head -1)"
          if [[ -n "$SANDBOXED_APP" ]]; then
            APP_NAME="$(basename "$SANDBOXED_APP")"
            # Derive name from existing ZIP to keep consistent naming
            EXISTING_ZIP="$(find examples/nucleus-demo/build/compose/binaries -name '*.zip' -type f | head -1)"
            if [[ -n "$EXISTING_ZIP" ]]; then
              BASE="$(basename "$EXISTING_ZIP" .zip)"
              SANDBOXED_ZIP="examples/nucleus-demo/build/compose/binaries/sandboxed-${BASE}.zip"
            else
              ARCH="$(uname -m | sed 's/x86_64/x64/;s/arm64/arm64/')"
              SANDBOXED_ZIP="examples/nucleus-demo/build/compose/binaries/sandboxed-${APP_NAME%.app}-${ARCH}.zip"
            fi
            echo "==> Zipping sandboxed .app: $SANDBOXED_APP → $SANDBOXED_ZIP"
            ditto -c -k --keepParent "$SANDBOXED_APP" "$SANDBOXED_ZIP"
          else
            echo "==> No sandboxed .app found (no PKG target?), skipping"
          fi

      - name: Upload packaged artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: |
            examples/nucleus-demo/build/compose/binaries/**/*.deb
            examples/nucleus-demo/build/compose/binaries/**/*.rpm
            examples/nucleus-demo/build/compose/binaries/**/*.pub.asc
            examples/nucleus-demo/build/compose/binaries/**/*.pacman
            examples/nucleus-demo/build/compose/binaries/**/*.snap
            examples/nucleus-demo/build/compose/binaries/**/*.flatpak
            examples/nucleus-demo/build/compose/binaries/**/*.AppImage
            examples/nucleus-demo/build/compose/binaries/**/*.appimage
            examples/nucleus-demo/build/compose/binaries/**/*.msi
            examples/nucleus-demo/build/compose/binaries/**/*.exe
            examples/nucleus-demo/build/compose/binaries/**/*.appx
            !examples/nucleus-demo/build/compose/binaries/**/runtime/**
            examples/nucleus-demo/build/compose/binaries/**/*.7z
            examples/nucleus-demo/build/compose/binaries/**/*.pkg
            examples/nucleus-demo/build/compose/binaries/**/*.dmg
            examples/nucleus-demo/build/compose/binaries/**/*.zip
            examples/nucleus-demo/build/compose/binaries/sandboxed-*.zip
            examples/nucleus-demo/build/compose/binaries/**/*.tar
            examples/nucleus-demo/build/compose/binaries/**/*.tar.gz
            examples/nucleus-demo/build/compose/binaries/**/*.blockmap
            examples/nucleus-demo/build/compose/binaries/**/signing-metadata.json
            examples/nucleus-demo/build/compose/binaries/**/packaging-metadata.json
            !examples/nucleus-demo/build/compose/binaries/**/app/**
          if-no-files-found: error

  universal-macos:
    name: Universal macOS Binary
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      HAS_SIGNING_CERTS: ${{ secrets.MAC_CERTIFICATES_P12 != '' }}
      HAS_PROVISIONING: ${{ secrets.MAC_PROVISIONING_PROFILE != '' }}
      HAS_NOTARIZATION: ${{ secrets.MAC_NOTARIZATION_APPLE_ID != '' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          sparse-checkout: |
            .github/actions
            examples/nucleus-demo/packaging/macos
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup macOS signing
        id: signing
        if: env.HAS_SIGNING_CERTS == 'true'
        uses: ./.github/actions/setup-macos-signing
        with:
          certificate-base64: ${{ secrets.MAC_CERTIFICATES_P12 }}
          certificate-password: ${{ secrets.MAC_CERTIFICATES_PASSWORD }}

      - name: Decode provisioning profiles
        if: env.HAS_PROVISIONING == 'true'
        shell: bash
        run: |
          echo "${{ secrets.MAC_PROVISIONING_PROFILE }}" | base64 -d > "$RUNNER_TEMP/embedded.provisionprofile"
          echo "PROVISIONING=$RUNNER_TEMP/embedded.provisionprofile" >> "$GITHUB_ENV"
          if [[ -n "${{ secrets.MAC_RUNTIME_PROVISIONING_PROFILE }}" ]]; then
            echo "${{ secrets.MAC_RUNTIME_PROVISIONING_PROFILE }}" | base64 -d > "$RUNNER_TEMP/runtime-embedded.provisionprofile"
            echo "RUNTIME_PROVISIONING=$RUNNER_TEMP/runtime-embedded.provisionprofile" >> "$GITHUB_ENV"
          fi

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macOS-arm64
          path: artifacts/release-assets-macOS-arm64

      - name: Download macOS amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macOS-amd64
          path: artifacts/release-assets-macOS-amd64

      - name: Build universal binary
        uses: ./.github/actions/build-macos-universal
        with:
          arm64-path: artifacts/release-assets-macOS-arm64
          x64-path: artifacts/release-assets-macOS-amd64
          output-path: artifacts/release-assets-macOS-universal
          signing-identity: ${{ secrets.MAC_DEVELOPER_ID_APPLICATION }}
          app-store-identity: ${{ secrets.MAC_APP_STORE_APPLICATION }}
          installer-identity: ${{ secrets.MAC_APP_STORE_INSTALLER }}
          keychain-path: ${{ steps.signing.outputs.keychain-path }}
          entitlements-file: examples/nucleus-demo/packaging/macos/entitlements.plist
          runtime-entitlements-file: examples/nucleus-demo/packaging/macos/runtime-entitlements.plist
          sandboxed-entitlements-file: examples/nucleus-demo/packaging/macos/entitlements-sandbox.plist
          sandboxed-runtime-entitlements-file: examples/nucleus-demo/packaging/macos/runtime-entitlements-sandbox.plist
          provisioning-profile: ${{ env.PROVISIONING }}
          runtime-provisioning-profile: ${{ env.RUNTIME_PROVISIONING }}

      - name: Notarize DMG
        if: env.HAS_NOTARIZATION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find artifacts/release-assets-macOS-universal -name '*.dmg' -type f | head -1)"
          if [[ -z "$DMG" ]]; then
            echo "::warning::No DMG found to notarize"
            exit 0
          fi

          echo "==> Submitting DMG for notarization: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "${{ secrets.MAC_NOTARIZATION_APPLE_ID }}" \
            --password "${{ secrets.MAC_NOTARIZATION_PASSWORD }}" \
            --team-id "${{ secrets.MAC_NOTARIZATION_TEAM_ID }}" \
            --wait

          echo "==> Stapling DMG"
          xcrun stapler staple "$DMG"

      - name: Notarize ZIP
        if: env.HAS_NOTARIZATION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find artifacts/release-assets-macOS-universal -name '*.zip' -type f | head -1)"
          if [[ -z "$ZIP" ]]; then
            echo "::warning::No ZIP found to notarize"
            exit 0
          fi

          echo "==> Submitting ZIP for notarization: $ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "${{ secrets.MAC_NOTARIZATION_APPLE_ID }}" \
            --password "${{ secrets.MAC_NOTARIZATION_PASSWORD }}" \
            --team-id "${{ secrets.MAC_NOTARIZATION_TEAM_ID }}" \
            --wait

          # ZIP is NOT stapled: re-zipping would invalidate the blockmap and break
          # differential auto-updates. Gatekeeper verifies notarization online anyway.
          echo "==> Skipping staple for ZIP (preserves blockmap for auto-update)"

      - name: Cleanup keychain
        if: ${{ always() && env.HAS_SIGNING_CERTS == 'true' }}
        shell: bash
        run: security delete-keychain "${{ steps.signing.outputs.keychain-path }}" || true

      - name: Upload universal macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macOS-universal
          path: artifacts/release-assets-macOS-universal
          if-no-files-found: error

  bundle-windows:
    name: Windows APPX Bundle
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          sparse-checkout: |
            .github/actions
            examples/nucleus-demo/packaging
          fetch-depth: 1

      - name: Download Windows amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-Windows-amd64
          path: artifacts/release-assets-Windows-amd64

      - name: Download Windows arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-Windows-arm64
          path: artifacts/release-assets-Windows-arm64

      - name: Build APPX Bundle
        uses: ./.github/actions/build-windows-appxbundle
        with:
          amd64-path: artifacts/release-assets-Windows-amd64
          arm64-path: artifacts/release-assets-Windows-arm64
          output-path: artifacts/release-assets-Windows-bundle
          certificate-password: 'ChangeMe-Temp123!'

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-Windows-bundle
          path: artifacts/release-assets-Windows-bundle
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [build, universal-macos, bundle-windows]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-assets-*

      - name: Determine version and channel
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "CHANNEL=alpha" >> "$GITHUB_ENV"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=latest" >> "$GITHUB_ENV"
          fi

          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]]; then
            echo "RELEASE_TYPE=prerelease" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TYPE=release" >> "$GITHUB_ENV"
          fi

      - name: List downloaded artifacts
        shell: bash
        run: find artifacts -type f | head -100

      - name: Generate update YML files
        uses: ./.github/actions/generate-update-yml
        with:
          artifacts-path: artifacts
          version: ${{ env.VERSION }}
          channel: ${{ env.CHANNEL }}

      - name: Show generated YML files
        shell: bash
        run: |
          echo "=== Generated update YML files ==="
          for f in artifacts/update-yml/*.yml; do
            echo "--- $(basename "$f") ---"
            cat "$f"
            echo
          done

      - name: Publish release
        uses: ./.github/actions/publish-release
        with:
          artifacts-path: artifacts
          tag: ${{ env.TAG }}
          release-type: ${{ env.RELEASE_TYPE }}
