name: Release Nucleus Lab (native image, JVM on Windows ARM)

on:
  push:
    tags:
      # Dev tags (`v3.0.0-dev-<timestamp>`) too: the Lab is attached to the GitHub pre-release
      # publish-maven creates once Central accepted the version. This workflow runs beside
      # publish-maven, never in its path, so the Maven deploy does not wait for any of it.
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # SignPath's action reads the uploaded artifact through the GitHub API.
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    runs-on: ubuntu-22.04
    outputs:
      is-dev: ${{ steps.tag.outputs.is-dev }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify release tag
        id: tag
        if: github.ref_type == 'tag'
        uses: ./.github/actions/release-tag-info

      - name: Validate release ref
        uses: ./.github/actions/validate-release-ref

  build-natives:
    needs: validate-release-ref
    uses: ./.github/workflows/build-natives.yaml

  build:
    # The Lab is released as a GraalVM native image everywhere native-image runs. Windows on
    # ARM has no native-image toolchain: that one leg ships the JVM build (all its formats).
    name: Build (${{ matrix.os }} / ${{ matrix.arch }} / ${{ matrix.native && 'native' || 'jvm' }})
    needs: [validate-release-ref, build-natives]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            native: true
            tasks: packageGraalvmDeb packageGraalvmRpm packageGraalvmAppImage packageGraalvmPacman packageGraalvmSnap packageGraalvmTar
          - os: ubuntu-22.04-arm
            arch: arm64
            native: true
            tasks: packageGraalvmDeb packageGraalvmRpm packageGraalvmAppImage packageGraalvmPacman packageGraalvmSnap packageGraalvmTar
          - os: windows-latest
            arch: amd64
            native: true
            tasks: packageGraalvmNsis packageGraalvmMsi packageGraalvmPortable
            # SignPath: the app image is built alone, signed, then packaged as is.
            app-image-task: createGraalvmNativeDistributable
            app-image-dir: main/graalvm-app
          - os: windows-11-arm
            arch: arm64
            native: false
            tasks: packageReleaseDistributionForCurrentOS
            # Only the loose launchers and DLLs: rewriting a JAR would void the AOT cache, which
            # the package task trains afterwards on the signed image.
            app-image-task: createReleaseDistributable
            app-image-dir: main-release/app
          - os: macos-latest
            arch: arm64
            native: true
            tasks: packageGraalvmDmg packageGraalvmZip
          # Intel macs fall back to Liberica NIK 25.0.x (both GraalVM distributions dropped macos-x64).
          - os: macos-15-intel
            arch: amd64
            native: true
            tasks: packageGraalvmDmg packageGraalvmZip

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ github.ref_name }}
      HAS_SIGNING_CERTS: ${{ secrets.MAC_CERTIFICATES_P12 != '' }}
      HAS_NOTARIZATION: ${{ secrets.MAC_NOTARIZATION_APPLE_ID != '' }}
      # SignPath Foundation signing (Windows). Read by the Lab build to turn its own signing off.
      NUCLEUS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize version for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          echo "RELEASE_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Setup Nucleus
        uses: ./.github/actions/setup-nucleus
        with:
          packaging-tools: 'true'
          graalvm: ${{ matrix.native && 'true' || 'false' }}
          snap: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          setup-gradle: 'true'

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Configure Linux GPG signing
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "No LINUX_GPG_PRIVATE_KEY secret set; skipping Linux package signing."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/nucleus-signing-key.asc"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          {
            echo "compose.desktop.linux.sign=true"
            echo "compose.desktop.linux.signing.keyId=$LINUX_GPG_KEY_ID"
            echo "compose.desktop.linux.signing.keyFile=$KEY_FILE"
            echo "compose.desktop.linux.signing.passphrase=$LINUX_GPG_PASSPHRASE"
            echo "compose.desktop.linux.signing.silentUpdate=true"
          } >> gradle.properties

      - name: Setup macOS signing
        id: signing
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERTS == 'true'
        uses: ./.github/actions/setup-macos-signing
        with:
          certificate-base64: ${{ secrets.MAC_CERTIFICATES_P12 }}
          certificate-password: ${{ secrets.MAC_CERTIFICATES_PASSWORD }}

      - name: Configure macOS signing
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERTS == 'true'
        shell: bash
        env:
          IDENTITY: ${{ secrets.MAC_DEVELOPER_ID_APPLICATION }}
        run: |
          # electron-builder takes the bare "NAME (TEAMID)" and adds the certificate type itself.
          {
            echo "compose.desktop.mac.sign=true"
            echo "compose.desktop.mac.signing.identity=${IDENTITY#Developer ID Application: }"
            echo "compose.desktop.mac.signing.keychain=${{ steps.signing.outputs.keychain-path }}"
          } >> gradle.properties

      # --- SignPath, stage 1: the app image (launchers, DLLs), before electron-builder packs it ---
      - name: Build app image for SignPath
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        shell: bash
        run: ./gradlew :examples:lab:app:${{ matrix.app-image-task }} -PnativeMarch=compatibility --stacktrace --no-daemon

      # SignPath re-signs whatever it is given (no "skip if signed"), so only the unsigned binaries go:
      # a vendor's signature (Microsoft, the JDK's) stays, as with the plugin's own signer.
      - name: Stage unsigned app image binaries
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $image = Resolve-Path "examples/lab/app/build/compose/binaries/${{ matrix.app-image-dir }}"
          $out = "$env:RUNNER_TEMP/signpath-app-image"
          Get-ChildItem $image -Recurse -File -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' } |
            ForEach-Object {
              $target = Join-Path $out $_.FullName.Substring($image.Path.Length + 1)
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Copy-Item $_.FullName $target
            }
          "Staged $((Get-ChildItem $out -Recurse -File).Count) unsigned binaries"

      - name: Upload unsigned app image binaries
        id: upload-app-image
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-app-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/signpath-app-image
          if-no-files-found: error

      - name: Sign app image binaries (SignPath)
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-image
          github-artifact-id: ${{ steps.upload-app-image.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-app-image-signed

      - name: Put signed binaries back into the app image
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $image = "examples/lab/app/build/compose/binaries/${{ matrix.app-image-dir }}"
          Copy-Item "$env:RUNNER_TEMP/signpath-app-image-signed/*" $image -Recurse -Force
          $unsigned = Get-ChildItem $image -Recurse -File -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' }
          if ($unsigned) { $unsigned.FullName; throw "Binaries left unsigned after SignPath" }

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          TASKS=""
          for task in ${{ matrix.tasks }}; do TASKS="$TASKS :examples:lab:app:$task"; done
          # With SignPath the image is already built and signed: rebuilding it would overwrite it.
          if [[ "$RUNNER_OS" == "Windows" && "$NUCLEUS_SIGNPATH" == "true" ]]; then
            TASKS="$TASKS -x :examples:lab:app:${{ matrix.app-image-task }}"
          fi
          ./gradlew $TASKS -PnativeMarch=compatibility --stacktrace --no-daemon

      # --- SignPath, stage 2: the installers electron-builder produced ---
      # ponytail: the NSIS uninstaller stays unsigned — electron-builder signs it mid-build, where
      # SignPath (artifact-based) cannot reach.
      - name: Stage installers
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $bin = Resolve-Path "examples/lab/app/build/compose/binaries"
          $out = "$env:RUNNER_TEMP/signpath-installers"
          # binaries/<appDir>/<format>/<installer>: deeper .exe files are app image copies.
          # Not -Include: it matches nothing on a multi-level wildcard path.
          Get-ChildItem "$bin/*/*/*" -File | Where-Object Extension -in '.exe', '.msi' | ForEach-Object {
            $target = Join-Path $out $_.FullName.Substring($bin.Path.Length + 1)
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          Get-ChildItem $out -Recurse -File | ForEach-Object FullName

      - name: Upload unsigned installers
        id: upload-installers
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-installers-${{ matrix.arch }}
          path: ${{ runner.temp }}/signpath-installers
          if-no-files-found: error

      - name: Sign installers (SignPath)
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-installers-signed

      # Signing changed the installers' bytes: their differential-update blockmaps are stale.
      # The update YMLs are hashed later, in the publish job, from these final files.
      - name: Put signed installers back, regenerate blockmaps
        if: runner.os == 'Windows' && env.NUCLEUS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $bin = Resolve-Path "examples/lab/app/build/compose/binaries"
          $signed = "$env:RUNNER_TEMP/signpath-installers-signed"
          Copy-Item "$signed/*" $bin -Recurse -Force
          $appBuilder = Get-ChildItem $bin -Recurse -File -Filter app-builder.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          Get-ChildItem $signed -Recurse -File | ForEach-Object {
            $file = Join-Path $bin $_.FullName.Substring((Resolve-Path $signed).Path.Length + 1)
            if (-not (Test-Path "$file.blockmap")) { return }
            if ($appBuilder) {
              & $appBuilder.FullName blockmap --input $file --output "$file.blockmap"
              if ($LASTEXITCODE -ne 0) { throw "app-builder blockmap failed for $file" }
            } else {
              Write-Warning "app-builder not found: dropping the stale blockmap of $file (full download on update)"
              Remove-Item "$file.blockmap"
            }
          }

      - name: Notarize DMG and ZIP
        if: runner.os == 'macOS' && env.HAS_NOTARIZATION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for ARTIFACT in $(find examples/lab/app/build/compose/binaries -type f \( -name '*.dmg' -o -name '*.zip' \)); do
            echo "==> Submitting for notarization: $ARTIFACT"
            xcrun notarytool submit "$ARTIFACT" \
              --apple-id "${{ secrets.MAC_NOTARIZATION_APPLE_ID }}" \
              --password "${{ secrets.MAC_NOTARIZATION_PASSWORD }}" \
              --team-id "${{ secrets.MAC_NOTARIZATION_TEAM_ID }}" \
              --wait
            # Only the DMG is stapled: re-zipping would invalidate the ZIP's blockmap and break
            # differential auto-updates. Gatekeeper checks a ZIP's notarization online anyway.
            if [[ "$ARTIFACT" == *.dmg ]]; then xcrun stapler staple "$ARTIFACT"; fi
          done

      - name: Cleanup keychain
        if: ${{ always() && runner.os == 'macOS' && env.HAS_SIGNING_CERTS == 'true' }}
        shell: bash
        run: security delete-keychain "${{ steps.signing.outputs.keychain-path }}" || true

      - name: Upload packaged artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: |
            examples/lab/app/build/compose/binaries/**/*.deb
            examples/lab/app/build/compose/binaries/**/*.rpm
            # Detached signatures (<pkg>.asc) for silent update + public keys (<pkg>.pub.asc)
            examples/lab/app/build/compose/binaries/**/*.asc
            examples/lab/app/build/compose/binaries/**/*.pacman
            examples/lab/app/build/compose/binaries/**/*.snap
            examples/lab/app/build/compose/binaries/**/*.AppImage
            examples/lab/app/build/compose/binaries/**/*.appimage
            examples/lab/app/build/compose/binaries/**/*.msi
            examples/lab/app/build/compose/binaries/**/*.exe
            examples/lab/app/build/compose/binaries/**/*.appx
            !examples/lab/app/build/compose/binaries/**/runtime/**
            examples/lab/app/build/compose/binaries/**/*.dmg
            examples/lab/app/build/compose/binaries/**/*.zip
            # Linux: the archive the Flathub manifest repackages (no source build on Flathub)
            examples/lab/app/build/compose/binaries/**/graalvm-tar.gz/**/*.tar.gz
            examples/lab/app/build/compose/binaries/**/*.blockmap
            examples/lab/app/build/compose/binaries/**/signing-metadata.json
            examples/lab/app/build/compose/binaries/**/packaging-metadata.json
            !examples/lab/app/build/compose/binaries/**/app/**
            !examples/lab/app/build/compose/binaries/**/graalvm-app/**
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [validate-release-ref, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-assets-*

      - name: Determine version and channel
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ "${{ needs.validate-release-ref.outputs.is-dev }}" == "true" ]]; then
            # Dev builds sit on a pre-release (never "latest"); their feed is the alpha channel,
            # so a stable install never sees them.
            echo "CHANNEL=alpha" >> "$GITHUB_ENV"
          elif [[ "$VERSION" == *"-alpha"* ]]; then
            echo "CHANNEL=alpha" >> "$GITHUB_ENV"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=latest" >> "$GITHUB_ENV"
          fi

          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-dev-"* ]]; then
            echo "RELEASE_TYPE=prerelease" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TYPE=release" >> "$GITHUB_ENV"
          fi

      - name: List downloaded artifacts
        shell: bash
        run: find artifacts -type f | head -100

      - name: Generate update YML files
        uses: ./.github/actions/generate-update-yml
        with:
          artifacts-path: artifacts
          version: ${{ env.VERSION }}
          channel: ${{ env.CHANNEL }}

      - name: Show generated YML files
        shell: bash
        run: |
          echo "=== Generated update YML files ==="
          for f in artifacts/update-yml/*.yml; do
            echo "--- $(basename "$f") ---"
            cat "$f"
            echo
          done

      # A dev pre-release is publish-maven's to create, once Central accepted the version: a
      # failed or cancelled Maven deploy must not leave a release for a version that does not
      # exist. Wait for it (the Maven deploy is normally done long before the Lab builds are),
      # and publish nothing if it never comes.
      - name: Wait for the dev pre-release
        if: needs.validate-release-ref.outputs.is-dev == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Pre-release $TAG exists."
              exit 0
            fi
            sleep 30
          done
          echo "::error::No pre-release $TAG after 60 min: the Maven deploy failed or is still running. Nothing published."
          exit 1

      - name: Publish release
        uses: ./.github/actions/publish-release
        with:
          artifacts-path: artifacts
          tag: ${{ env.TAG }}
          release-type: ${{ env.RELEASE_TYPE }}
