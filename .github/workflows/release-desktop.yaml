name: Release Nucleus Lab (native image, JVM on Windows ARM)

on:
  push:
    tags:
      # Dev tags (`v3.0.0-dev-<timestamp>`) too: the Lab is attached to the GitHub pre-release
      # publish-maven creates once Central accepted the version. This workflow runs beside
      # publish-maven, never in its path, so the Maven deploy does not wait for any of it.
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    runs-on: ubuntu-22.04
    outputs:
      is-dev: ${{ steps.tag.outputs.is-dev }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify release tag
        id: tag
        if: github.ref_type == 'tag'
        uses: ./.github/actions/release-tag-info

      - name: Validate release ref
        uses: ./.github/actions/validate-release-ref

  build-natives:
    needs: validate-release-ref
    uses: ./.github/workflows/build-natives.yaml

  build:
    # The Lab is released as a GraalVM native image everywhere native-image runs. Windows on
    # ARM has no native-image toolchain: that one leg ships the JVM build (all its formats).
    name: Build (${{ matrix.os }} / ${{ matrix.arch }} / ${{ matrix.native && 'native' || 'jvm' }})
    needs: [validate-release-ref, build-natives]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            native: true
            tasks: packageGraalvmDeb packageGraalvmRpm packageGraalvmAppImage packageGraalvmPacman packageGraalvmSnap
          - os: ubuntu-22.04-arm
            arch: arm64
            native: true
            tasks: packageGraalvmDeb packageGraalvmRpm packageGraalvmAppImage packageGraalvmPacman packageGraalvmSnap
          - os: windows-latest
            arch: amd64
            native: true
            tasks: packageGraalvmNsis packageGraalvmMsi packageGraalvmPortable
          - os: windows-11-arm
            arch: arm64
            native: false
            tasks: packageReleaseDistributionForCurrentOS
          - os: macos-latest
            arch: arm64
            native: true
            tasks: packageGraalvmDmg packageGraalvmZip
          # Intel macs fall back to Liberica NIK 25.0.x (both GraalVM distributions dropped macos-x64).
          - os: macos-15-intel
            arch: amd64
            native: true
            tasks: packageGraalvmDmg packageGraalvmZip

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ github.ref_name }}
      HAS_SIGNING_CERTS: ${{ secrets.MAC_CERTIFICATES_P12 != '' }}
      HAS_NOTARIZATION: ${{ secrets.MAC_NOTARIZATION_APPLE_ID != '' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize version for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          echo "RELEASE_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Setup Nucleus
        uses: ./.github/actions/setup-nucleus
        with:
          packaging-tools: 'true'
          graalvm: ${{ matrix.native && 'true' || 'false' }}
          snap: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          setup-gradle: 'true'

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Configure Linux GPG signing
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "No LINUX_GPG_PRIVATE_KEY secret set; skipping Linux package signing."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/nucleus-signing-key.asc"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          {
            echo "compose.desktop.linux.sign=true"
            echo "compose.desktop.linux.signing.keyId=$LINUX_GPG_KEY_ID"
            echo "compose.desktop.linux.signing.keyFile=$KEY_FILE"
            echo "compose.desktop.linux.signing.passphrase=$LINUX_GPG_PASSPHRASE"
            echo "compose.desktop.linux.signing.silentUpdate=true"
          } >> gradle.properties

      - name: Setup macOS signing
        id: signing
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERTS == 'true'
        uses: ./.github/actions/setup-macos-signing
        with:
          certificate-base64: ${{ secrets.MAC_CERTIFICATES_P12 }}
          certificate-password: ${{ secrets.MAC_CERTIFICATES_PASSWORD }}

      - name: Configure macOS signing
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERTS == 'true'
        shell: bash
        env:
          IDENTITY: ${{ secrets.MAC_DEVELOPER_ID_APPLICATION }}
        run: |
          # electron-builder takes the bare "NAME (TEAMID)" and adds the certificate type itself.
          {
            echo "compose.desktop.mac.sign=true"
            echo "compose.desktop.mac.signing.identity=${IDENTITY#Developer ID Application: }"
            echo "compose.desktop.mac.signing.keychain=${{ steps.signing.outputs.keychain-path }}"
          } >> gradle.properties

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          TASKS=""
          for task in ${{ matrix.tasks }}; do TASKS="$TASKS :examples:lab:app:$task"; done
          ./gradlew $TASKS -PnativeMarch=compatibility --stacktrace --no-daemon

      - name: Notarize DMG and ZIP
        if: runner.os == 'macOS' && env.HAS_NOTARIZATION == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for ARTIFACT in $(find examples/lab/app/build/compose/binaries -type f \( -name '*.dmg' -o -name '*.zip' \)); do
            echo "==> Submitting for notarization: $ARTIFACT"
            xcrun notarytool submit "$ARTIFACT" \
              --apple-id "${{ secrets.MAC_NOTARIZATION_APPLE_ID }}" \
              --password "${{ secrets.MAC_NOTARIZATION_PASSWORD }}" \
              --team-id "${{ secrets.MAC_NOTARIZATION_TEAM_ID }}" \
              --wait
            # Only the DMG is stapled: re-zipping would invalidate the ZIP's blockmap and break
            # differential auto-updates. Gatekeeper checks a ZIP's notarization online anyway.
            if [[ "$ARTIFACT" == *.dmg ]]; then xcrun stapler staple "$ARTIFACT"; fi
          done

      - name: Cleanup keychain
        if: ${{ always() && runner.os == 'macOS' && env.HAS_SIGNING_CERTS == 'true' }}
        shell: bash
        run: security delete-keychain "${{ steps.signing.outputs.keychain-path }}" || true

      - name: Upload packaged artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: |
            examples/lab/app/build/compose/binaries/**/*.deb
            examples/lab/app/build/compose/binaries/**/*.rpm
            # Detached signatures (<pkg>.asc) for silent update + public keys (<pkg>.pub.asc)
            examples/lab/app/build/compose/binaries/**/*.asc
            examples/lab/app/build/compose/binaries/**/*.pacman
            examples/lab/app/build/compose/binaries/**/*.snap
            examples/lab/app/build/compose/binaries/**/*.AppImage
            examples/lab/app/build/compose/binaries/**/*.appimage
            examples/lab/app/build/compose/binaries/**/*.msi
            examples/lab/app/build/compose/binaries/**/*.exe
            examples/lab/app/build/compose/binaries/**/*.appx
            !examples/lab/app/build/compose/binaries/**/runtime/**
            examples/lab/app/build/compose/binaries/**/*.dmg
            examples/lab/app/build/compose/binaries/**/*.zip
            examples/lab/app/build/compose/binaries/**/*.blockmap
            examples/lab/app/build/compose/binaries/**/signing-metadata.json
            examples/lab/app/build/compose/binaries/**/packaging-metadata.json
            !examples/lab/app/build/compose/binaries/**/app/**
            !examples/lab/app/build/compose/binaries/**/graalvm-app/**
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [validate-release-ref, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-assets-*

      - name: Determine version and channel
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ "${{ needs.validate-release-ref.outputs.is-dev }}" == "true" ]]; then
            # Dev builds sit on a pre-release (never "latest"); their feed is the alpha channel,
            # so a stable install never sees them.
            echo "CHANNEL=alpha" >> "$GITHUB_ENV"
          elif [[ "$VERSION" == *"-alpha"* ]]; then
            echo "CHANNEL=alpha" >> "$GITHUB_ENV"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=latest" >> "$GITHUB_ENV"
          fi

          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-dev-"* ]]; then
            echo "RELEASE_TYPE=prerelease" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TYPE=release" >> "$GITHUB_ENV"
          fi

      - name: List downloaded artifacts
        shell: bash
        run: find artifacts -type f | head -100

      - name: Generate update YML files
        uses: ./.github/actions/generate-update-yml
        with:
          artifacts-path: artifacts
          version: ${{ env.VERSION }}
          channel: ${{ env.CHANNEL }}

      - name: Show generated YML files
        shell: bash
        run: |
          echo "=== Generated update YML files ==="
          for f in artifacts/update-yml/*.yml; do
            echo "--- $(basename "$f") ---"
            cat "$f"
            echo
          done

      # A dev pre-release is publish-maven's to create, once Central accepted the version: a
      # failed or cancelled Maven deploy must not leave a release for a version that does not
      # exist. Wait for it (the Maven deploy is normally done long before the Lab builds are),
      # and publish nothing if it never comes.
      - name: Wait for the dev pre-release
        if: needs.validate-release-ref.outputs.is-dev == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Pre-release $TAG exists."
              exit 0
            fi
            sleep 30
          done
          echo "::error::No pre-release $TAG after 60 min: the Maven deploy failed or is still running. Nothing published."
          exit 1

      - name: Publish release
        uses: ./.github/actions/publish-release
        with:
          artifacts-path: artifacts
          tag: ${{ env.TAG }}
          release-type: ${{ env.RELEASE_TYPE }}
