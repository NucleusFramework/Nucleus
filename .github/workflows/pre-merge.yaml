          )
          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING: $f" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then exit 1; fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Gradle tasks
        run: ./gradlew preMerge --continue

  # Stage-1 offscreen Tao scene tests on the full OS matrix. These tests are
  # headless (CPU-recorded ComposeScene, no display), so plain runners work on
  # all three platforms; the native artifacts are downloaded for the
  # native-load smoke tests, which self-skip when their platform libs are absent.
  tao-tests:
    needs: build-natives
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Tao scene tests
        run: ./gradlew :decorated-window-tao:test

  # Stage-2 headful suite: real Tao windows in a single event loop per process
  # (taoHeadfulTest JavaExec). macOS/Windows runners have a real graphical
  # session; Linux gets Xvfb + openbox (floating WM, so move/resize/maximize
  # requests behave — the suite still skips the WM-owned-geometry cases there).
  tao-headful:
    needs: build-natives
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Mesa software OpenGL (Windows)
        if: runner.os == 'Windows'
        # Hosted runners' display adapter exposes no usable WGL context, so
        # the Tao scene host cannot attach. Mesa's llvmpipe opengl32.dll,
        # dropped next to java.exe (first directory in the DLL search order),
        # gives every JVM-launched window a real software GL context.
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          path: C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk\*\x64\bin

      - name: Install display stack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox mesa-utils libegl1 libgl1-mesa-dri libgtk-3-0

      - name: Run headful suite (Linux, under Xvfb + openbox)
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1200x24 &
          for i in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
          openbox &
          sleep 1
          ./gradlew :decorated-window-tao:taoHeadfulTest

      - name: Run headful suite
        if: runner.os != 'Linux'
        run: ./gradlew :decorated-window-tao:taoHeadfulTest

      - name: Smoke standalone NSPanel chain (macOS)
        if: runner.os == 'macOS'
        # Ownerless NSPanel + Metal pipeline + reposition/orderFront/orderOut
        # cycle — the standalone-popup native chain has no other CI coverage.
        run: ./gradlew :decorated-window-tao:smokeStandalonePanelMac

  # Native accessibility protocol: launches tao-demo on its A11y tab and
  # verifies the OS-level projection from the OUTSIDE, through the same client
  # APIs assistive tech uses — UIA on Windows (hard gate), AT-SPI via pyatspi
  # on Linux (hard gate), the AX client API on macOS (self-skips on runners:
  # AX clients need the TCC Accessibility permission, which CI cannot grant).
  tao-a11y:
    needs: build-natives
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # All three legs are gating. The Windows protocol has been validated
    # end-to-end on real hardware (physical GPU, Windows 11): all probe
    # assertions pass, no SKIPPED. The historical hosted-runner self-skips
    # were NOT a display-adapter/WGL limitation — the Windows host renders
    # through ANGLE/D3D11 (WARP-capable on VMs), so the scene attaches and
    # composes fine on runners. The empty UIA tree was an idle-activation
    # race: a UIA client connecting while the scene was idle set the native
    # resync flag, but nothing re-armed the semantics walk, so the provider
    # kept serving the 1-node seed tree. The walk scheduler now polls the
    # activation gate while a walk is parked, so the tree is projected within
    # ~250 ms of the first WM_GETOBJECT. The probe's self-skip remains as a
    # safety valve, but any partial exposure with failing assertions is a
    # real regression and fails hard. macOS (AX client — hosted runners are
    # TCC-trusted) and Linux (AT-SPI) verify the full round-trips in CI.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # NOTE: a Mesa/llvmpipe opengl32.dll install step used to sit here. It
      # was a red herring: the Windows host renders through ANGLE/D3D11 (WARP
      # on runners), never through WGL/opengl32, so Mesa had no effect. The
      # real cause of the empty UIA tree (idle-activation race) is fixed in
      # the a11y sync scheduler — see the job comment above.
      - name: Build tao-demo (so the probe timeout is not spent compiling)
        run: ./gradlew :examples:tao-demo:jar

      - name: Install display + AT-SPI stack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox mesa-utils libegl1 libgl1-mesa-dri libgtk-3-0 \
            at-spi2-core python3-pyatspi dbus-x11 xdotool

      - name: Verify AT-SPI projection (Linux)
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1200x24 &
          for i in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
          openbox &
          eval $(dbus-launch --sh-syntax)
          export DBUS_SESSION_BUS_ADDRESS
          # Same switch scripts/a11y-linux-iter.sh flips: without it the a11y
          # bus reports disabled and AccessKit never registers.
          dbus-send --session --dest=org.a11y.Bus --type=method_call --print-reply \
            /org/a11y/bus org.freedesktop.DBus.Properties.Set \
            string:org.a11y.Status string:IsEnabled variant:boolean:true
          NUCLEUS_DEMO_TAB=A11y ./gradlew --no-daemon :examples:tao-demo:run > /tmp/tao-demo.log 2>&1 &
          status=0
          # Ordered so the mutation-sensitive probe runs on a pristine tree:
          # verify-atspi.py asserts the exact 'click counter 1' transition.
          python3 scripts/ci/verify-atspi.py || status=$?
          python3 scripts/ci/verify-atspi-tree-golden.py --fixture a11y-tab --strict-extra \
            --out-dir /tmp/a11y-diff || status=$?
          python3 scripts/ci/verify-atspi-tree-golden.py --fixture complex-tab --strict-extra \
            --out-dir /tmp/a11y-diff || status=$?
          python3 scripts/ci/verify-atspi-all-tabs.py || status=$?
          python3 scripts/ci/verify-atspi-events.py || status=$?
          python3 scripts/ci/verify-atspi-keyboard.py || status=$?
          if [ $status -ne 0 ]; then
            echo "── tao-demo log ($(wc -l < /tmp/tao-demo.log) lines) ──"
            cat /tmp/tao-demo.log || true
          fi
          pkill -f dev.nucleusframework.sampletao.MainKt || true
          exit $status

      - name: Verify UIA projection (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NUCLEUS_DEMO_TAB=A11y NUCLEUS_A11Y_DEBUG=1 \
            ./gradlew --no-daemon :examples:tao-demo:run > /tmp/tao-demo.log 2>&1 &
          status=0
          pwsh -File scripts/ci/verify-uia.ps1 -Title "Tao Backend Demo" -TimeoutSec 300 || status=$?
          echo "── java processes ──"
          tasklist | grep -i java || true
          echo "── proven dump-uia-tree.ps1 -Process java ──"
          pwsh -File scripts/dump-uia-tree.ps1 -Process java -MaxDepth 5 || true
          echo "── tao-demo full log ($(wc -l < /tmp/tao-demo.log) lines) ──"
          cat /tmp/tao-demo.log || true
          taskkill //F //IM java.exe //T 2>/dev/null || true
          exit $status

      - name: Verify AX projection (macOS, self-skips without TCC trust)
        if: runner.os == 'macOS'
        run: |
          NUCLEUS_DEMO_TAB=A11y ./gradlew --no-daemon :examples:tao-demo:run > /tmp/tao-demo.log 2>&1 &
          for i in $(seq 1 90); do
            APP_PID=$(pgrep -f dev.nucleusframework.sampletao.MainKt || true)
            [ -n "$APP_PID" ] && break
            sleep 2
          done
          if [ -z "$APP_PID" ]; then echo "tao-demo never started"; tail -50 /tmp/tao-demo.log; exit 1; fi
          status=0
          swift scripts/ci/verify-ax.swift "$APP_PID" || status=$?
          pkill -f dev.nucleusframework.sampletao.MainKt || true
          exit $status
