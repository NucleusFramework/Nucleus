name: Build Native Libraries

on:
  workflow_call:

# The native binaries are a pure function of the native sources, so each
# platform job caches its whole output tree keyed on a hash of every
# src/main/native/** file (plus this workflow, so adding a module's build
# step invalidates the key). On a cache hit every compile/toolchain step is
# skipped and the job only verifies the restored tree and re-publishes the
# per-platform artifact that downstream jobs consume with a single
# `pattern: natives-*` download. Bump the `natives-v1` prefix to force a
# full rebuild.

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Restore native output cache
        id: natives-cache
        uses: actions/cache@v4
        with:
          path: '*/src/main/resources/nucleus/native/win32-*'
          key: natives-v1-windows-${{ hashFiles('**/src/main/native/**', '.github/workflows/build-natives.yaml') }}

      - name: Setup JDK 21
        if: steps.natives-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup MSVC
        if: steps.natives-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build darkmode-detector Windows native DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call darkmode-detector\src\main\native\windows\build.bat

      - name: Build native-ssl Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call native-ssl\src\main\native\windows\build.bat

      - name: Build decorated-window-jni Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call decorated-window-jni\src\main\native\windows\build.bat

      - name: Build system-color Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call system-color\src\main\native\windows\build.bat

      - name: Build energy-manager Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call energy-manager\src\main\native\windows\build.bat

      - name: Build taskbar-progress Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call taskbar-progress\src\main\native\windows\build.bat

      - name: Build notification-windows Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call notification-windows\src\main\native\windows\build.bat

      - name: Build autolaunch Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call autolaunch\src\main\native\windows\build.bat

      - name: Build launcher-windows Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call launcher-windows\src\main\native\windows\build.bat

      - name: Build global-hotkey Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call global-hotkey\src\main\native\windows\build.bat

      - name: Build decorated-window-core Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call decorated-window-core\src\main\native\windows\build.bat

      - name: Build system-info Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call system-info\src\main\native\windows\build.bat

      - name: Build scheduler Windows native DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call scheduler\src\main\native\windows\build.bat

      - name: Build media-control Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call media-control\src\main\native\windows\build.bat

      - name: Setup Rust (Windows)
        if: steps.natives-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Build fs-watcher Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call fs-watcher\src\main\native\windows\build.bat

      - name: Build decorated-window-tao Windows DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: call decorated-window-tao\src\main\native\windows\build.bat

      # ANGLE (libEGL + libGLESv2) backs the Tao Windows Direct3D-11 render path.
      # Fetched from a pinned Electron release with SHA-256 verification (never
      # committed — see .gitignore). Lands in the same win32-*/ dirs so it ships
      # (and is cached) inside the natives-windows artifact.
      - name: Fetch ANGLE runtime DLLs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash decorated-window-tao/src/main/native/windows/fetch-angle.sh all

      - name: Verify Windows natives
        shell: bash
        run: |
          FILES=(
            "darkmode-detector/nucleus_windows_theme.dll"
            "native-ssl/nucleus_ssl.dll"
            "decorated-window-jni/nucleus_windows_decoration.dll"
            "system-color/nucleus_systemcolor.dll"
            "energy-manager/nucleus_energy_manager.dll"
            "taskbar-progress/nucleus_taskbar_progress.dll"
            "notification-windows/nucleus_notification_windows.dll"
            "autolaunch/nucleus_autolaunch.dll"
            "launcher-windows/nucleus_launcher_windows.dll"
            "global-hotkey/nucleus_global_hotkey.dll"
            "decorated-window-core/nucleus_layout_direction.dll"
            "system-info/nucleus_system_info.dll"
            "scheduler/nucleus_scheduler.dll"
            "media-control/nucleus_media_control_windows.dll"
            "fs-watcher/nucleus_fs_watcher.dll"
            "decorated-window-tao/nucleus_tao.dll"
            "decorated-window-tao/nucleus_tao_windows_deco.dll"
            "decorated-window-tao/nucleus_tao_gl.dll"
            "decorated-window-tao/nucleus_tao_dnd.dll"
            "decorated-window-tao/nucleus_tao_windows_native_view.dll"
            "decorated-window-tao/libEGL.dll"
            "decorated-window-tao/libGLESv2.dll"
          )
          MISSING=0
          for arch in win32-x64 win32-aarch64; do
            for e in "${FILES[@]}"; do
              f="${e%%/*}/src/main/resources/nucleus/native/$arch/${e#*/}"
              if [ -f "$f" ]; then
                echo "OK: $f ($(wc -c < "$f") bytes)"
              else
                echo "MISSING: $f" >&2
                MISSING=1
              fi
            done
          done
          if [ "$MISSING" = "1" ]; then exit 1; fi

      - name: Upload Windows natives
        uses: actions/upload-artifact@v4
        with:
          name: natives-windows
          path: '*/src/main/resources/nucleus/native/win32-*/'
          retention-days: 1

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Restore native output cache
        id: natives-cache
        uses: actions/cache@v4
        with:
          path: '*/src/main/resources/nucleus/native/darwin-*'
          key: natives-v1-macos-${{ hashFiles('**/src/main/native/**', '.github/workflows/build-natives.yaml') }}

      - name: Setup JDK 21
        if: steps.natives-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build darkmode-detector macOS native dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash darkmode-detector/src/main/native/macos/build.sh

      - name: Build native-ssl macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash native-ssl/src/main/native/macos/build.sh

      - name: Build decorated-window-jbr macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash decorated-window-jbr/src/main/native/macos/build.sh

      - name: Build decorated-window-jni macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash decorated-window-jni/src/main/native/macos/build.sh

      - name: Build system-color macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash system-color/src/main/native/macos/build.sh

      - name: Build energy-manager macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash energy-manager/src/main/native/macos/build.sh

      - name: Build taskbar-progress macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash taskbar-progress/src/main/native/macos/build.sh

      - name: Build notification-macos macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash notification-macos/src/main/native/macos/build.sh

      - name: Build service-management-macos macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash service-management-macos/src/main/native/macos/build.sh

      - name: Build scheduler macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash scheduler/src/main/native/macos/build.sh

      - name: Build launcher-macos macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash launcher-macos/src/main/native/macos/build.sh

      - name: Build global-hotkey macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash global-hotkey/src/main/native/macos/build.sh

      - name: Build menu-macos macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash menu-macos/src/main/native/macos/build.sh

      - name: Build decorated-window-core macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash decorated-window-core/src/main/native/macos/build.sh

      - name: Build system-info macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash system-info/src/main/native/macos/build.sh

      - name: Build media-control macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash media-control/src/main/native/macos/build.sh

      - name: Setup Rust (macOS)
        if: steps.natives-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build fs-watcher macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash fs-watcher/src/main/native/macos/build.sh

      - name: Build decorated-window-tao macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash decorated-window-tao/src/main/native/macos/build.sh

      - name: Build graalvm-runtime macOS dylibs
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash graalvm-runtime/src/main/native/macos/build.sh

      - name: Verify macOS natives
        run: |
          FILES=(
            "darkmode-detector/libnucleus_darkmode.dylib"
            "native-ssl/libnucleus_ssl.dylib"
            "decorated-window-jbr/libnucleus_macos.dylib"
            "decorated-window-jni/libnucleus_macos_jni.dylib"
            "system-color/libnucleus_systemcolor.dylib"
            "energy-manager/libnucleus_energy_manager.dylib"
            "taskbar-progress/libnucleus_taskbar_progress.dylib"
            "notification-macos/libnucleus_notification.dylib"
            "service-management-macos/libnucleus_service_management.dylib"
            "scheduler/libnucleus_scheduler.dylib"
            "launcher-macos/libnucleus_launcher_macos.dylib"
            "global-hotkey/libnucleus_global_hotkey.dylib"
            "menu-macos/libnucleus_menu_macos.dylib"
            "decorated-window-core/libnucleus_layout_direction.dylib"
            "system-info/libnucleus_system_info.dylib"
            "media-control/libnucleus_media_control_macos.dylib"
            "fs-watcher/libnucleus_fs_watcher.dylib"
            "decorated-window-tao/libnucleus_tao.dylib"
            "decorated-window-tao/libnucleus_tao_metal.dylib"
            "decorated-window-tao/libnucleus_tao_dnd.dylib"
            "decorated-window-tao/libnucleus_tao_macos_deco.dylib"
            "decorated-window-tao/libnucleus_tao_macos_popup.dylib"
            "decorated-window-tao/libnucleus_tao_macos_native_view.dylib"
            "graalvm-runtime/libnucleus_locale.dylib"
          )
          MISSING=0
          for arch in darwin-aarch64 darwin-x64; do
            for e in "${FILES[@]}"; do
              f="${e%%/*}/src/main/resources/nucleus/native/$arch/${e#*/}"
              if [ -f "$f" ]; then
                echo "OK: $f ($(wc -c < "$f") bytes)"
              else
                echo "MISSING: $f" >&2
                MISSING=1
              fi
            done
          done
          if [ "$MISSING" = "1" ]; then exit 1; fi

      - name: Upload macOS natives
        uses: actions/upload-artifact@v4
        with:
          name: natives-macos
          path: '*/src/main/resources/nucleus/native/darwin-*/'
          retention-days: 1

  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Restore native output cache
        id: natives-cache
        uses: actions/cache@v4
        with:
          path: '*/src/main/resources/nucleus/native/linux-*'
          key: natives-v1-linux-${{ matrix.arch }}-${{ hashFiles('**/src/main/native/**', '.github/workflows/build-natives.yaml') }}

      - name: Setup JDK 21
        if: steps.natives-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build dependencies
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libx11-dev libglib2.0-dev libgtk-3-dev

      - name: Build darkmode-detector Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash darkmode-detector/src/main/native/linux/build.sh

      - name: Build decorated-window-jni Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash decorated-window-jni/src/main/native/linux/build.sh

      - name: Build linux-hidpi native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash linux-hidpi/src/main/native/linux/build.sh

      - name: Build spellcheck native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash spellcheck/src/main/native/linux/build.sh

      - name: Build system-color Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash system-color/src/main/native/linux/build.sh

      - name: Build energy-manager Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash energy-manager/src/main/native/linux/build.sh

      - name: Build notification-linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash notification-linux/src/main/native/linux/build.sh

      - name: Build launcher-linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash launcher-linux/src/main/native/linux/build.sh

      - name: Build autolaunch Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash autolaunch/src/main/native/linux/build.sh

      - name: Build decorated-window-core Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash decorated-window-core/src/main/native/linux/build.sh

      - name: Build system-info Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash system-info/src/main/native/linux/build.sh

      - name: Build global-hotkey Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash global-hotkey/src/main/native/linux/build.sh

      - name: Build scheduler Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash scheduler/src/main/native/linux/build.sh

      - name: Build media-control Linux native shared library
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash media-control/src/main/native/linux/build.sh

      - name: Setup Rust (Linux)
        if: steps.natives-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Build fs-watcher Linux native libraries
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash fs-watcher/src/main/native/linux/build.sh

      - name: Build decorated-window-tao Linux native libraries
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: bash decorated-window-tao/src/main/native/linux/build.sh

      - name: Verify Linux natives
        run: |
          FILES=(
            "darkmode-detector/libnucleus_linux_theme.so"
            "decorated-window-jni/libnucleus_linux_jni.so"
            "linux-hidpi/libnucleus_linux_hidpi_jni.so"
            "spellcheck/libnucleus_spellcheck.so"
            "system-color/libnucleus_systemcolor.so"
            "energy-manager/libnucleus_energy_manager.so"
            "notification-linux/libnucleus_notification_linux.so"
            "launcher-linux/libnucleus_launcher_linux.so"
            "autolaunch/libnucleus_autolaunch_linux.so"
            "decorated-window-core/libnucleus_layout_direction.so"
            "system-info/libnucleus_system_info.so"
            "global-hotkey/libnucleus_global_hotkey.so"
            "scheduler/libnucleus_scheduler_linux.so"
            "media-control/libnucleus_media_control_linux.so"
            "fs-watcher/libnucleus_fs_watcher.so"
            "decorated-window-tao/libnucleus_tao.so"
            "decorated-window-tao/libnucleus_tao_egl.so"
            "decorated-window-tao/libnucleus_tao_linux_widget.so"
            "decorated-window-tao/libnucleus_tao_linux_popup.so"
          )
          MISSING=0
          for e in "${FILES[@]}"; do
            f="${e%%/*}/src/main/resources/nucleus/native/linux-${{ matrix.arch }}/${e#*/}"
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING: $f" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then exit 1; fi

      - name: Upload Linux natives
        uses: actions/upload-artifact@v4
        with:
          name: natives-linux-${{ matrix.arch }}
          path: '*/src/main/resources/nucleus/native/linux-*/'
          retention-days: 1
