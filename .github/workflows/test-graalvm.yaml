name: Test GraalVM Native Image

# Invoked from pre-merge after cheap JVM gates succeed. Does not rebuild
# natives — the caller must have already uploaded natives-* artifacts.
on:
  workflow_call:

jobs:
  # One job per OS. Order matters: e2e first (the only place we actually RUN a
  # native image), then package nucleus-demo. If the test image fails to build
  # or run, we skip the demo package and save a second native-image compile.
  # fail-fast cancels the other OSes when one is broken (typical: shared plugin
  # / reachability / Kotlin regression), so we don't burn three runners for the
  # same root cause.
  graalvm:
    name: GraalVM - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: macOS ARM64
            os: macos-latest
          - name: Windows x64
            os: windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Setup Nucleus (GraalVM)
        uses: ./.github/actions/setup-nucleus
        with:
          graalvm: 'true'
          setup-gradle: 'true'

      # ── Stage 1: build + run the Tao native test pyramid ────────────────
      # Compiles examples/tao-native-test, then executes the packaged binary
      # twice — `battery` (stage-1 offscreen, headless) and `headful` (stage-2
      # real windows). This is the only place produced native binaries are
      # actually RUN in CI, so it also catches missing reachability metadata.
      - name: Build native test runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :examples:tao-native-test:packageGraalvmNative -PnativeMarch=compatibility --no-daemon --stacktrace

      - name: Install display stack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Xvfb itself comes from setup-nucleus, which also starts it. x11-utils provides
          # xdpyinfo, which the next step uses to wait for and check the X server.
          sudo apt-get install -y openbox mesa-utils x11-utils libegl1 libgl1-mesa-dri libgtk-3-0

      - name: Run native test pyramid (Linux, under Xvfb + openbox)
        if: runner.os == 'Linux'
        run: |
          # setup-nucleus (packaging-tools) already runs Xvfb and exports DISPLAY; a second
          # `Xvfb :99` here only failed with "Server is already active for display 99".
          test -n "${DISPLAY:-}" || { echo "::error::DISPLAY is not set; setup-nucleus should start Xvfb"; exit 1; }
          for i in $(seq 1 50); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.2; done
          xdpyinfo -display "$DISPLAY" >/dev/null || { echo "::error::No X server on $DISPLAY"; exit 1; }
          openbox &
          sleep 1
          # Use the PACKAGED binary: the plugin extracts skiko/jawt/icudtl
          # next to it, which the bare nativeCompile artifact lacks.
          # Layout: compose/binaries/<appDirName>/graalvm-app/ (mirrors JVM distributable).
          BIN=$(find examples/tao-native-test/build/compose/binaries -type f -name 'tao-native-test' | head -1)
          echo "binary: $BIN"
          test -n "$BIN" && test -x "$BIN"
          "$BIN" battery
          "$BIN" headful

      - name: Run native test pyramid
        if: runner.os != 'Linux'
        shell: bash
        env:
          # Arms the macOS scrollWheel: injector the trackpad headful cases drive
          # (nativeDiagInjectScrollWheel); without it they fail. taoHeadfulTest sets the
          # same variable for the JVM run.
          NUCLEUS_TAO_INPUT_INJECTION: '1'
        run: |
          # Use the PACKAGED binary: the plugin extracts skiko/jawt/icudtl
          # next to it, which the bare nativeCompile artifact lacks.
          # Layout: compose/binaries/<appDirName>/graalvm-app/ (mirrors JVM distributable).
          BIN=$(find examples/tao-native-test/build/compose/binaries -type f \( -name 'tao-native-test' -o -name 'tao-native-test.exe' \) | head -1)
          echo "binary: $BIN"
          test -n "$BIN"
          "$BIN" battery
          "$BIN" headful

      # ── Stage 2: package nucleus-demo (only if e2e passed) ──────────────
      - name: Build GraalVM native image (nucleus-demo)
        shell: bash
        # GraalVM CE is resolved through the GitHub releases API. Hosted runners share an IP,
        # so the 60/hour anonymous limit is routinely exhausted — authenticate the call.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :examples:nucleus-demo:packageGraalvmNative -PnativeMarch=compatibility --no-daemon --stacktrace

      - name: Upload GraalVM artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graalvm-${{ runner.os }}
          path: |
            examples/nucleus-demo/build/compose/binaries/**/graalvm-app/**
          if-no-files-found: warn
