name: Setup Nucleus
description: Setup JBR, packaging tools, Gradle, and Node.js for Nucleus builds

inputs:
  java-version:
    description: 'JBR (JetBrains Runtime) version used to run Gradle and bundled by jpackage in JVM packaging builds. A bare LTS major like "25" resolves to the latest JBR build; setup-java handles every CI OS/arch, including windows-aarch64 where Temurin 25 is EA-only.'
    required: false
    default: '25'
  java-package:
    description: 'JBR package variant (jdk, jre, jdk+jcef, jre+jcef, jdk+ft, jre+ft). Defaults to the full JDK so jpackage/jlink can build a custom runtime.'
    required: false
    default: 'jdk'
  packaging-tools:
    description: 'Install xvfb, rpm, fakeroot, libarchive-tools (Linux only)'
    required: false
    default: 'true'
  flatpak:
    description: 'Install Flatpak + Freedesktop SDK 24.08 (Linux only)'
    required: false
    default: 'false'
  snap:
    description: 'Install Snapd + Snapcraft (Linux only)'
    required: false
    default: 'false'
  setup-gradle:
    description: 'Setup Gradle via gradle/actions/setup-gradle@v5'
    required: false
    default: 'true'
  graalvm:
    description: 'Prepare a GraalVM native-image build: native build tools (Xcode/MSVC) and toolchain cache. The GraalVM JDK itself is auto-downloaded by the Nucleus plugin.'
    required: false
    default: 'false'
  graalvm-version:
    description: 'GraalVM toolchain version, used only as a cache-key component. Keep in sync with the graalvm { toolchain { } } DSL (e.g. 25i1, 25).'
    required: false
    default: '25i1'
  setup-node:
    description: 'Setup Node.js'
    required: false
    default: 'true'
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'

outputs:
  java-home:
    description: 'Path to the JBR installation'
    value: ${{ steps.set-java-home.outputs.java-home }}

runs:
  using: composite
  steps:
    # ── JDK (JetBrains Runtime) ────────────────────────────────────────
    # JBR is the single JDK for every job. setup-java's jetbrains distribution
    # resolves the latest JBR build for the given LTS major and covers every CI
    # OS/arch — including windows-aarch64, where Temurin 25 is only published as
    # an EA beta. jpackage bundles this JDK into the distributed app, and
    # decorated-window-jbr needs the JBR API at runtime. In GraalVM mode the
    # native image is built entirely by the plugin-provisioned GraalVM, so the
    # Gradle JDK contributes nothing to that output — JBR is used uniformly for
    # simplicity.
    - name: Set up JDK (JBR)
      uses: actions/setup-java@v4
      with:
        distribution: 'jetbrains'
        java-version: ${{ inputs.java-version }}
        java-package: ${{ inputs.java-package }}
      env:
        GITHUB_TOKEN: ${{ github.token }}

    # ── GraalVM native-image prerequisites ──────────────────────────────
    # The GraalVM JDK is not installed here: the Nucleus plugin auto-downloads
    # Oracle GraalVM (Liberica NIK on Intel macOS) per the graalvm { toolchain { } }
    # DSL and caches it under ~/.gradle/nucleus/graalvm. Only the native build
    # tools (Xcode/MSVC) and the toolchain cache are GraalVM-specific.
    - name: Select Xcode 26
      if: runner.os == 'macOS' && inputs.graalvm == 'true'
      shell: bash
      run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

    - name: Setup MSVC
      if: runner.os == 'Windows' && inputs.graalvm == 'true'
      uses: ilammy/msvc-dev-cmd@v1

    # Keyed per OS/arch: the plugin resolves a platform-specific toolchain, and
    # cache entries with different keys are never shared across runners.
    - name: Cache GraalVM toolchain
      if: inputs.graalvm == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.gradle/nucleus/graalvm
        key: graalvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ inputs.graalvm-version }}

    - name: Set java-home output
      id: set-java-home
      shell: bash
      run: echo "java-home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

    - name: Verify JDK
      shell: bash
      run: java -version

    # ── Packaging tools (Linux only) ────────────────────────────────────
    - name: Install packaging tools (Linux)
      if: runner.os == 'Linux' && inputs.packaging-tools == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y xvfb rpm fakeroot libarchive-tools libdbus-1-dev libglib2.0-dev libx11-dev libgtk-3-dev patchelf
        if ! pgrep -x Xvfb >/dev/null 2>&1; then
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
        fi
        echo "DISPLAY=:99" >> "$GITHUB_ENV"

    # ── Flatpak (Linux only) ────────────────────────────────────────────
    - name: Install Flatpak (Linux)
      if: runner.os == 'Linux' && inputs.flatpak == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        # Install runtimes for the current user — flatpak-builder (via @malept/flatpak-bundler)
        # defaults to --user mode and won't find system-only runtimes.
        flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak --user install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

    # ── Snap (Linux only) ───────────────────────────────────────────────
    - name: Install Snap (Linux)
      if: runner.os == 'Linux' && inputs.snap == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y snapd
        sudo systemctl enable --now snapd.socket || true
        sudo systemctl start snapd || true
        sudo snap wait system seed.loaded || true
        echo "/snap/bin" >> "$GITHUB_PATH"
        sudo snap install snapcraft --classic
        /snap/bin/snapcraft --version

    # ── Gradle ──────────────────────────────────────────────────────────
    - name: Setup Gradle
      if: inputs.setup-gradle == 'true'
      uses: gradle/actions/setup-gradle@v5

    # ── Node.js ─────────────────────────────────────────────────────────
    - name: Setup Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
