name: Setup Nucleus
description: Setup the JDK, packaging tools, Gradle, and Node.js for Nucleus builds

inputs:
  java-version:
    description: 'JDK version used to run Gradle and bundled by jpackage in JVM packaging builds. A bare LTS major like "25" resolves to the latest build of the per-OS distribution (Microsoft Build of OpenJDK on Windows, Temurin elsewhere).'
    required: false
    default: '25'
  java-package:
    description: 'JDK package variant (jdk, jre). Defaults to the full JDK so jpackage/jlink can build a custom runtime.'
    required: false
    default: 'jdk'
  packaging-tools:
    description: 'Install xvfb, rpm, fakeroot, libarchive-tools (Linux only)'
    required: false
    default: 'true'
  flatpak:
    description: 'Install Flatpak + Freedesktop SDK 24.08 (Linux only)'
    required: false
    default: 'false'
  snap:
    description: 'Install Snapd + Snapcraft (Linux only)'
    required: false
    default: 'false'
  setup-gradle:
    description: 'Setup Gradle via gradle/actions/setup-gradle@v6 (open-source basic cache provider)'
    required: false
    default: 'true'
  graalvm:
    description: 'Prepare a GraalVM native-image build: native build tools (Xcode/MSVC). The GraalVM JDK itself is auto-downloaded by the Nucleus plugin.'
    required: false
    default: 'false'

outputs:
  java-home:
    description: 'Path to the JDK installation'
    value: ${{ steps.set-java-home.outputs.java-home }}

runs:
  using: composite
  steps:
    # ── JDK ─────────────────────────────────────────────────────────────
    # Windows (x64 and aarch64) uses the Microsoft Build of OpenJDK: it is the
    # only mainstream distribution with GA windows-aarch64 builds for current
    # LTS majors (Temurin still ships that arch as EA). Every other OS/arch uses
    # Temurin, matching the rest of the workflows. jpackage bundles this JDK into
    # the distributed app. In GraalVM mode the native image is built entirely by
    # the plugin-provisioned GraalVM, so the Gradle JDK contributes nothing to
    # that output.
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: ${{ runner.os == 'Windows' && 'microsoft' || 'temurin' }}
        java-version: ${{ inputs.java-version }}
        java-package: ${{ inputs.java-package }}
      env:
        GITHUB_TOKEN: ${{ github.token }}

    # ── GraalVM native-image prerequisites ──────────────────────────────
    # The GraalVM JDK is not installed here: the Nucleus plugin auto-downloads
    # GraalVM Community Edition by default (Liberica NIK on Intel macOS) per the
    # graalvm { toolchain { } } DSL into ~/.gradle/nucleus/graalvm. It is not
    # cached: ~300 MB per OS/arch, saved again for every tag and PR ref, it
    # pushed the repo past the 10 GB Actions cache limit and got the Gradle
    # caches evicted, all to save a download. Only the native build tools
    # (Xcode/MSVC) are GraalVM-specific.
    - name: Select Xcode 26
      if: runner.os == 'macOS' && inputs.graalvm == 'true'
      shell: bash
      run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

    - name: Setup MSVC
      if: runner.os == 'Windows' && inputs.graalvm == 'true'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set java-home output
      id: set-java-home
      shell: bash
      run: echo "java-home=$JAVA_HOME" >> "$GITHUB_OUTPUT"

    - name: Verify JDK
      shell: bash
      run: java -version

    # ── Packaging tools (Linux only) ────────────────────────────────────
    - name: Install packaging tools (Linux)
      if: runner.os == 'Linux' && inputs.packaging-tools == 'true'
      shell: bash
      run: |
        set -euo pipefail
        "${{ github.action_path }}/../../scripts/apt-install.sh" xvfb rpm fakeroot libarchive-tools libdbus-1-dev libglib2.0-dev libx11-dev libgtk-3-dev patchelf
        if ! pgrep -x Xvfb >/dev/null 2>&1; then
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
        fi
        echo "DISPLAY=:99" >> "$GITHUB_ENV"

    # ── Flatpak (Linux only) ────────────────────────────────────────────
    - name: Install Flatpak (Linux)
      if: runner.os == 'Linux' && inputs.flatpak == 'true'
      shell: bash
      run: |
        set -euo pipefail
        "${{ github.action_path }}/../../scripts/apt-install.sh" flatpak flatpak-builder
        # Install runtimes for the current user — flatpak-builder (via @malept/flatpak-bundler)
        # defaults to --user mode and won't find system-only runtimes.
        flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak --user install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

    # ── Snap (Linux only) ───────────────────────────────────────────────
    - name: Install Snap (Linux)
      if: runner.os == 'Linux' && inputs.snap == 'true'
      shell: bash
      run: |
        set -euo pipefail
        "${{ github.action_path }}/../../scripts/apt-install.sh" snapd
        sudo systemctl enable --now snapd.socket || true
        sudo systemctl start snapd || true
        sudo snap wait system seed.loaded || true
        echo "/snap/bin" >> "$GITHUB_PATH"
        sudo snap install snapcraft --classic
        /snap/bin/snapcraft --version

    # ── Gradle ──────────────────────────────────────────────────────────
    - name: Setup Gradle
      if: inputs.setup-gradle == 'true'
      uses: gradle/actions/setup-gradle@v6
      with:
        # Open-source cache on GitHub Actions cache; v6's default provider is proprietary.
        cache-provider: basic

    # ── Node.js ─────────────────────────────────────────────────────────
    # No actions/setup-node: the Nucleus plugin downloads the Node.js it runs
    # electron-builder with into ~/.gradle/nucleus/nodejs, so CI packages with
    # the same toolchain a developer machine does. Not cached, for the same
    # reason as the GraalVM toolchain.
