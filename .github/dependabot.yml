version: 2

# Grouped deliberately: ungrouped, this repository's dependency count would open
# dozens of pull requests the first week and a steady trickle after. One PR per
# group per week is reviewable; a major version bump still comes on its own,
# because that is the one that needs reading.
updates:
  # Runtime libraries and the version catalog, including
  # dev.nucleusframework:nucleus.angle-natives -- which is how a new ANGLE
  # release branch reaches Nucleus.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
        update-types: [minor, patch]
      angle:
        patterns:
          - "dev.nucleusframework:nucleus.angle-natives"
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
          - "dev.nucleusframework:nucleus.angle-natives"
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # The Gradle plugin is an included build with its own dependency graph.
  - package-ecosystem: gradle
    directory: /plugin-build
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

# Deliberately not covered:
#
#  - cargo (decorated-window-tao/src/main/native): the crate graph is pinned
#    through [patch.crates-io] onto vendored, patched forks of tao and the
#    accesskit crates. Dependabot would propose upgrades that silently drop
#    those patches.
#  - npm (plugin-build/plugin/src/main/resources/nucleus/electron-builder): the
#    package.json / package-lock.json pair is generated by
#    scripts/update-electron-builder-lock.sh and pinned on purpose, so the two
#    would fight over the lockfile.
