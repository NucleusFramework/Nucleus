# Heap budget: the build may take up to 80% of the machine's RAM. That is 40% here and not
# 80% because the Kotlin compile daemon is a second process that mirrors this daemon's
# computed max heap — `kotlin.daemon.jvmargs` is ignored by the current Kotlin Gradle plugin,
# so the two together are the budget and each gets half of it.
# A percentage rather than a fixed -Xmx, so the same number holds on CI and on dev machines.
org.gradle.jvmargs=-XX:MaxRAMPercentage=40 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Android
android.useAndroidX=true
# AGP 9 rejects `com.android.application` alongside the Kotlin Multiplatform plugin and
# steers KMP modules to `com.android.kotlin.multiplatform.library` — which is a *library*
# plugin, so examples:cmp-demo (a KMP module that also builds a real Android app) can't
# adopt it without being split into a separate :androidApp module. These two flags are
# AGP's documented escape hatch for exactly that case.
android.builtInKotlin=false
android.newDsl=false
